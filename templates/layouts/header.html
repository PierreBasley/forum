{{define "header"}}
<header class=""site-header>
    <div class="container site-header__inner">
    <a class="site-brand" href="/">Forum</a>
    <nav class="site-nav">
        <ul class="site-nav__list">
            <li><a class="site-nav__link" href="/posts">Voir les posts</a></li>
            {{if .IsActive}}
            <li><a class="site-nav__link" href="/profile">Mon profil</a></li>
            <li><a class="site-nav__link" href="/logout">Se déconnecter</a></li>
            <li><a class="button" href="/create-post">Créer un post</a></li>
            {{else}}
            <li><a class="site-nav__link" href="/login">Se connecter</a></li>
            <li><a class="button button--outline" href="/register">Créer un compte</a></li>
            {{end}}
        </ul>
    </nav>
</div>
</header>
{{end}}
