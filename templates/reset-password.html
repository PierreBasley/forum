<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - Forum</title>
</head>
<body>

    <h1>Réinitialiser le mot de passe</h1>

    <form action="/reset-password" method="POST">

        <p>
            <label for="email">Email :</label><br>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="code">Code reçu par email :</label><br>
            <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                required
            >
        </p>

        <p>
            <label for="password">Nouveau mot de passe :</label><br>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <p>
            <label for="password_confirm">
                Confirmer le nouveau mot de passe :
            </label><br>
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                required
            >
        </p>

        <button type="submit">Changer le mot de passe</button>

    </form>

    <p>
        <a href="/login">Retour à la connexion</a>
    </p>

</body>
</html>
