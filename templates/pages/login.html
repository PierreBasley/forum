<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header"}}
    <h2>Connexion</h2>
    <form action="/login" method="POST">
        <p>
            <label for="login-email">Email :</label><br>
            <input
                type="email"
                id="login-email"
                name="email"
                required
            >
        </p>
        <p>
            <label for="login-password">Mot de passe :</label><br>
            <input
                type="password"
                id="login-password"
                name="password"
                required
            >
        </p>
        <button type="submit">Se connecter</button>
    </form>
{{template "footer"}}
</body>
</html>
