<!DOCTYPE html>
<html lang="fr">
{{template "head"}}

<body>
    {{template "header" .Auth}}

    <!-- Contenu principal, aligné avec le reste du site. -->
    <main class="container page-content">

        <!-- Panneau regroupant le titre et le formulaire. -->
        <section class="auth-panel" aria-labelledby="login-title">
            <div class="auth-panel__intro">
                <h1 id="login-title">Se connecter</h1>
                <p>Retrouve la communauté et participe aux échanges.</p>
            </div>

            <!-- Les noms des champs et la destination restent identiques
                 à ceux du formulaire existant. -->
            <form class="form" action="/login" method="POST">

                <!-- Chaque groupe associe un libellé et son champ. -->
                <div class="form-field">
                    <label for="login-email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="login-password">Mot de passe</label>
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        required
                    >
                </div>

                <a class="form__recovery" href="/forgot-password">Mot de passe oublié ?</a>
                <button class="button form__submit" type="submit">Se connecter</button>
            </form>

            <p class="auth-panel__alternative">Pas encore de compte ? <a href="/register">Créer un compte</a></p>
        </section>
    </main>

    {{template "footer"}}
</body>
</html>
