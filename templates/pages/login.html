<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header" .Auth}}
    <h2>Connexion</h2>
    <form action="/login" method="POST">
            <label for="login-email">Email :</label>
            <br>
            <input
                type="email"
                id="login-email"
                name="email"
                required
            >
        <br>
            <label for="login-password">Mot de passe :</label>
            <br>
            <input
                type="password"
                id="login-password"
                name="password"
                required
            >
        <br>
        <button type="submit">Se connecter</button>
        <br>
        <a href="/forgot-password">Mot de passe oublié ?</a>
    </form>
{{template "footer"}}
</body>
</html>
