<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header" .Auth}}
    <!-- Reprend la largeur et les espacements communs aux pages. -->
    <main class="container page-content">

        <!-- Réutilise le panneau centré des formulaires de connexion. -->
        <section class="auth-panel" aria-labelledby="forgot-password-title">
            <div class="auth-panel__intro">
                <h1 id="forgot-password-title">Mot de passe oublié ?</h1>
                <p>Saisis l’adresse e-mail de ton compte pour demander un code de réinitialisation.</p>
            </div>

            <!-- Conserve la destination et le nom du champ existants. -->
            <form class="form" action="/forgot-password" method="POST">
                <div class="form-field">
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>
                <button class="button form__submit" type="submit">Demander un code</button>
            </form>
            <p class="auth-panel__alternative">
                <a href="/login">Retour à la connexion</a>
            </p>
        </section>
    </main>

{{template "footer"}}
</body>
</html>
