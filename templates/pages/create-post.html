<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header"}}
    <h2>Créer un nouveau post</h2>
    <form action="/create-post" method="POST">
        <label for="title">Titre :</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <label for="content">Contenu :</label><br>
        <textarea id="content" name="content" required></textarea><br><br>


        <!-- Maybe, we should create a table categories ? -->
        <label>Catégories :</label><br>
        <input type="checkbox" id="cat-sql" name="categories" value="sql">
        <label for="cat-sql">SQL</label><br>

        <input type="checkbox" id="cat-go" name="categories" value="go">
        <label for="cat-go">Go</label><br>

        <input type="checkbox" id="cat-html" name="categories" value="html">
        <label for="cat-html">HTML</label><br><br>

        <button type="submit">Publier</button>
    </form>
    <br>
    <a href="/posts">
        <button type="button">Voir les posts</button>
    </a>
    {{template "footer"}}
</body>
</html>
