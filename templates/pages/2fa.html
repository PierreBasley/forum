<!DOCTYPE html>
<html lang="fr">

{{template "head"}}

<body>
{{template "header"}}
    <h1>Vérification en deux étapes</h1>

    <p>
        Un code de vérification à 6 chiffres vient d'être envoyé
        à votre adresse email.
    </p>

    <p>
        Ce code est valable pendant 5 minutes.
    </p>

    <form action="/2fa" method="POST">

        <label for="code">
            Code de vérification :
        </label>

        <br>

        <input
            type="text"
            id="code"
            name="code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            minlength="6"
            autocomplete="one-time-code"
            required
        >

        <br><br>

        <button type="submit">
            Vérifier le code
        </button>

    </form>

    <br>

    <form action="/2fa/resend" method="POST">

        <button type="submit">
            Recevoir un nouveau code
        </button>

    </form>
{{template "footer"}}
</body>

</html>
