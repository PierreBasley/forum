<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header" .Auth}}
    <main class="container page-content">
        <section class="auth-panel" aria-labelledby="reset-password-title">
            <div class="auth-panel__intro">
                <h1 id="reset-password-title">Réinitialiser le mot de passe</h1>
                <p>Saisis ton code de réinitialisation, puis choisis un nouveau mot de passe.</p>
            </div>

            <!-- Conserve les noms de champs attendus par votre serveur. -->
            <form class="form" action="/reset-password" method="POST">
                <div class="form-field">
                    <label for="email">Adresse e-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="code">Code de réinitialisation</label>

                    <!-- Un code est une chaîne de caractères,
                         même lorsqu’il contient uniquement des chiffres. -->
                    <input
                        type="text"
                        id="code"
                        name="code"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        minlength="6"
                        maxlength="6"
                        aria-describedby="code-help"
                        required
                    >

                    <p class="form-field__help" id="code-help">
                        Saisis les 6 chiffres du code,
                        sans espace.
                    </p>
                </div>

                <div class="form-field">
                    <label for="password">
                        Nouveau mot de passe
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password_confirm">
                        Confirmer le nouveau mot de passe
                    </label>

                    <input
                        type="password"
                        id="password_confirm"
                        name="password_confirm"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button class="button form__submit" type="submit">
                    Modifier mon mot de passe
                </button>

            </form>

            <p class="auth-panel__alternative">
                <a href="/forgot-password">
                    Demander un nouveau code
                </a>
            </p>
        </section>
    </main>
{{template "footer"}}
</body>
</html>
