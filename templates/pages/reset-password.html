<!DOCTYPE html>
<html lang="fr">
{{template "head"}}
<body>
{{template "header"}}
    <h2>Réinitialiser le mot de passe</h2>
    <form action="/reset-password" method="POST">
        <br>
            <label for="code">Code reçu par email :</label><br>
            <input
                type="text"
                id="code"
                name="code"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                required
            >
        <br>
            <label for="password">Nouveau mot de passe :</label><br>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        <br>
            <label for="password_confirm">Confirmer le nouveau mot de passe :</label><br>
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                required
            >
        <br>
        <button type="submit">Changer le mot de passe</button>
    </form>
    <p><a href="/login">Retour à la connexion</a></p>
{{template "footer"}}
</body>
</html>
